<!doctype html>
<!-- 声セクション「横スワイプ化」配置デモ（2026-09-16）
     本番ビルド対象外。preview/voice-swipe.html に手動コピーして見せる用。
     狙い＝縦に間伸びさせず声を3→5件に増やす（本人発案）。
     注意：make_preview.py は preview/ を毎回作り直すので、実行後はこのファイルと
     img/voice4.png・voice5.png を再コピーすること。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>配置デモ｜お受け取りになった方から</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sumi:#121013;--sumi2:#1a1714;--kinari:#f0e8d8;--sub:#b8a98e;--gold:#E7C24B}
*{box-sizing:border-box}
body{margin:0;background:var(--sumi);color:var(--kinari);font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:64px 0 80px}
h2{font-size:20px;font-weight:500;letter-spacing:.14em;line-height:1.6;margin:0;padding:0 24px}
.h2-line{height:1px;margin:16px 24px 10px;background:linear-gradient(to right,transparent,var(--gold),transparent);opacity:.55}
.hint{font-size:11px;color:var(--sub);letter-spacing:.12em;padding:0 24px;margin:0}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:24px 24px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 82%;scroll-snap-align:center;background:var(--sumi2);border:1px solid rgba(231,194,75,.14);border-radius:10px;padding:20px 16px 16px}
.label{display:inline-block;font-size:11px;color:var(--gold);letter-spacing:.18em;margin-bottom:10px}
.quote{font-size:14.5px;line-height:1.9;letter-spacing:.06em;margin:0 0 14px;min-height:84px}
.shot img{width:100%;height:auto;display:block;border-radius:6px}
.note{font-size:12px;color:var(--sub);letter-spacing:.06em;line-height:1.9;padding:20px 24px 0;margin:0}
.meta{font-size:10px;color:#6b6152;letter-spacing:.1em;padding:48px 24px 0;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h2>お受け取りになった方から</h2>
  <div class="h2-line"></div>
  <div class="rail">
    <div class="card">
      <span class="label">誰にも言えなかったこと</span>
      <p class="quote">「もう限界だと、誰にも言えないままでした」</p>
      <div class="shot"><img src="img/voice1.jpg" alt=""></div>
    </div>
    <div class="card">
      <span class="label">これから先のこと</span>
      <p class="quote">「20年張り詰めていた肩の力が、すっと抜けました」</p>
      <div class="shot"><img src="img/voice2.jpg" alt=""></div>
    </div>
    <div class="card">
      <span class="label">ご縁のこと</span>
      <p class="quote">「5年しんどかった関係が、自然とほどけていきました」</p>
      <div class="shot"><img src="img/voice3.jpg" alt=""></div>
    </div>
    <div class="card">
      <span class="label">ご家族のこと</span>
      <p class="quote">「止まっていた全部が、動き始めました」</p>
      <div class="shot"><img src="img/voice4.png" alt=""></div>
    </div>
    <div class="card">
      <span class="label">申し込んだ日の夜に</span>
      <p class="quote">「まだ鑑定前なのに、気持ちが落ち着いたんです」</p>
      <div class="shot"><img src="img/voice5.png" alt=""></div>
    </div>
  </div>

  <p class="note">※実際にお受け取りになった方より、掲載の許可をいただいて紹介しています。</p>

  <p class="meta">※これは配置の下書きデモです（本番LPには未反映・計測なし）。</p>
</div>
</body>
</html>
