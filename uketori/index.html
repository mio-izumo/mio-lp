<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>澪からのお届け</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sumi:#121013; --sumi2:#1c1916; --kinari:#f0e8d8; --sub:#b8a98e;
  --gold:#E7C24B; --green:#06C755; --line:rgba(240,232,216,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  color:var(--kinari); background:#0d0b0e; line-height:1.9; letter-spacing:.04em;
}
.page{max-width:430px;margin:0 auto;min-height:100vh;background:var(--sumi);
  border-left:1px solid var(--line);border-right:1px solid var(--line);
  display:flex;flex-direction:column}

/* 上の帯（DMの見出しの形） */
.head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:rgba(18,16,19,.96);border-bottom:1px solid var(--line)}
.head img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid rgba(231,194,75,.5)}
.head b{font-weight:500;font-size:17px;display:block;line-height:1.3}
.head span{font-size:12px;color:var(--sub)}

/* 今DMで送れないことのお知らせ */
.notice{margin:16px 16px 4px;padding:12px 14px;border:1px solid rgba(231,194,75,.35);
  border-radius:10px;font-size:14px;color:var(--sub);line-height:1.8;text-align:center;white-space:pre-line}

.chat{flex:1;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:flex-end;opacity:0;transform:translateY(8px);
  transition:opacity .45s ease,transform .45s ease}
.row.show{opacity:1;transform:none}
.row img.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.bubble{max-width:86%;padding:14px 14px;letter-spacing:.02em;border-radius:18px;font-size:17px;white-space:pre-wrap;word-break:break-word}
.mio .bubble{background:var(--sumi2);border:1px solid var(--line);border-bottom-left-radius:6px}
.me{justify-content:flex-end}
.me .bubble{background:var(--gold);color:#1a1408;font-weight:500;border-bottom-right-radius:6px}

/* 入力中の点 */
.dots{display:inline-flex;gap:5px;padding:16px 18px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* パネル（DMのボタン付きカードの形） */
.panel{max-width:94%;border-radius:16px;overflow:hidden;background:var(--sumi2);border:1px solid var(--line)}
.panel img{display:block;width:100%;aspect-ratio:1.91/1;object-fit:cover;background:#222}
.panel .t{padding:14px 16px 2px;font-size:20px;font-weight:700;line-height:1.45;color:#fff}
.panel .s{padding:2px 16px 4px;font-size:17px;font-weight:600;color:var(--gold,#e7c24b);letter-spacing:.08em}
.panel a{display:block;margin:8px 12px 14px;padding:14px 10px;border-radius:10px;text-align:center;
  background:var(--green);color:#fff;font-size:17px;font-weight:500;text-decoration:none;letter-spacing:.06em}

/* 下の返事ボタン（1通目への返事の代わり） */
.reply{position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:rgba(18,16,19,.97);border-top:1px solid var(--line);text-align:center;
  opacity:0;transition:opacity .45s ease}
.reply.show{opacity:1}
.reply small{display:block;margin-bottom:8px;font-size:13px;color:var(--sub)}
.reply form{display:flex;gap:8px;align-items:center}
.reply input{flex:1;min-width:0;padding:13px 16px;border:1px solid rgba(231,194,75,.55);border-radius:999px;
  background:#0d0b0e;color:var(--kinari);font-family:inherit;font-size:17px;outline:none}
.reply input::placeholder{color:#7d725f}
.reply input:focus{border-color:var(--gold)}
.reply button{flex:none;padding:13px 20px;border:0;border-radius:999px;background:var(--gold);color:#1a1408;
  font-family:inherit;font-size:17px;font-weight:500;letter-spacing:.08em;cursor:pointer}
.reply.shake input{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.reply.gone{display:none}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <img src="img/icon.jpg" alt="">
    <div><b>澪</b><span>出雲の霊視</span></div>
  </div>

  <p class="notice" id="notice"></p>

  <div class="chat" id="chat"></div>

  <div class="reply" id="reply">
    <small id="hint"></small>
    <form id="form" autocomplete="off">
      <input id="msg" type="text" enterkeyhint="send" aria-label="メッセージ">
      <button type="submit">送信</button>
    </form>
  </div>
</div>

<script>
/* ===== 受け取りページ（プロフィールのリンク）=====
   開く → 案内（全員同じ・短く）→ 投稿で伝えた言葉を打って送る → その投稿の1通目＋すぐ下にLINEのボタン（11/28〜・前は2つ目の言葉→2通目→ボタン）
   POSTS に投稿ごとに1件足す（kw＝投稿の締めで「送ってください」と言う言葉）。合わない言葉は FALLBACK（最新のフィード）。
   計測：/log に open・send（k＝当たった投稿）・line。?auto・?p を付けたときは数えない。 */
var GREET = '澪です。\nここを開いてくださって、\nありがとうございます。\n\nあなたを疲れさせている縁が、\nもうすぐ近くまで来ています。\n\nしかし、\nこのまま閉じてしまうと、\n誰なのか分からないまま\n十二月に入ってしまいます。\n\n今、投稿で見た言葉を\n下の欄から送ってください。\nあなたの縁を、\n出雲から視てまいります。';
var PANEL = { img: 'https://ig-autoreply.pages.dev/img/6wtfV8ZfpX4P', title: '何度占っても変わらなかったあなたへ', sub: '出雲式無料鑑定',
              button: '澪のお伺いを受け取る', url: 'https://lin.ee/tlTM2Vw' };
var POSTS = [
  { key: 'shiru', from: '2026-11-24', type: 'any', kw: ['知る', 'しる', '知り', '視る', 'みる'], kw2: '知ります',
    msg1: '⚠️閉じる前に、\nこれだけは読んでください。\n\n投稿を見て、\nここまで来られた。\nそれは偶然ではないと\n私は思っています。\n\nあなたを疲れさせているのが、\n家族なのか、\n職場の人なのか。\n人によってまるで違います。\n\n下のボタンを押していただければ、\n視えたものを\nそのままお届けします。\n\n正体が分からないままだと、\n十二月もまた\n同じ人に振り回されます。\n\n下のボタンから、\nお待ちしています。',
    msg2: 'よく送ってくださいました。\n正体が見えた方から、\n重い縁は離れていきます。\n\n下のボタンを押すと、\n澪から最初のお伺いが\n届きます。\nいただいたお返事を、\n私が一人で読んで視ます。\n\n押さずに閉じると、\n誰に疲れさせられているのか\n知らないまま\n年を越すことになります。\n\n届いた順にお返ししています。' },
  { key: '1125f', from: '2026-11-25', type: 'feed', kw: ['結ぶ', '結び'], kw2: '結びます',
    msg1: '⚠️閉じる前に、\nこれだけは読んでください。\n\n今年結んだ縁は、\n11月28日を過ぎると\n結び目が固まります。\nゆるみかけた縁は、\nそのままほどけていくのです。\n\nあなたの縁が、\nどこでゆるみかけているのか。\n11月28日までに、\n何を結び直せばいいのか。\n\n下のボタンを押していただければ、\n視えたものを\nそのままお届けします。\n\n縁がゆるみかけているのは、\nあなたが冷たいから\nではありません。\n誰かの気持ちを先に守って\nここまで来たからです。\n\n下のボタンから、\nお待ちしています。',
    msg2: 'あなたの縁は、まだ\n結び直せるところにあります。\n11月28日までなら、\n間に合います。\n\n下のボタンを押すと、\n澪から最初のお伺いが\n届きます。\nいただいたお返事を、\n私が一人で読んで視ます。\n\n押さずに閉じると、\nゆるんだ縁は\nほどけたまま一年が過ぎます。\n\n届いた順にお返ししています。' },
  { key: '1125r', from: '2026-11-25', type: 'reel', kw: ['断ち切る', '断ち切', 'たちきる', 'たちき'], kw2: '断ち切ります',
    msg1: '⚠️閉じる前に、\nこれだけは読んでください。\n\n切ったはずの悪縁は、\n十二月に入ると一度だけ\n戻ってこようとすると\n言われています。\n\nあなたを疲れさせている縁が、\n家族なのか、職場なのか。\n誰との縁が重いのかは、\n人によってまるで違います。\n\n下のボタンを押していただければ、\n視えたものを\nそのままお届けします。\n\n正体が分からないまま\n十二月を迎えると、\n同じ人に、\nまた一年振り回されます。\n\n下のボタンから、\nお待ちしています。',
    msg2: '重い縁を手放せるのは、\n正体が見えた人だけです。\n十二月に入る前なら、\n間に合います。\n\n下のボタンを押すと、\n澪から最初のお伺いが\n届きます。\nいただいたお返事を、\n私が一人で読んで視ます。\n\n押さずに閉じると、\n同じ縁に\nまた一年振り回されます。\n\n届いた順にお返ししています。' },
  { key: '1126f', from: '2026-11-25', type: 'feed', kw: ['くぐる', 'くぐり'], kw2: 'くぐります',
  msg1: '⚠️閉じる前に、\nこれだけは読んでください。\n\n11月29日に、\n縁の扉が閉じます。\n外に残された縁は、\n来年まで戻せないのです。\n\nあなたの縁が、\nどこからこぼれているのか。\n11月29日までに、\n何をすれば内側へ入れるのか。\n\n下のボタンを押していただければ、\n視えたものを\nそのままお届けします。\n\n縁がこぼれているのは、\nあなたの想いが\n足りないからではありません。\n誰かに席を譲りつづけて\nきたからです。\n\n下のボタンから、\nお待ちしています。',
  msg2: 'あなたの縁は、まだ\n扉の手前にあります。\n11月29日までなら、\n間に合います。\n\n下のボタンを押すと、\n澪から最初のお伺いが\n届きます。\nいただいたお返事を、\n私が一人で読んで視ます。\n\n押さずに閉じると、\n縁は外に置かれたまま\n一年が過ぎます。\n\n届いた順にお返ししています。' },
  { key: '1126r', from: '2026-11-25', type: 'reel', kw: ['つなぐ', '繋ぐ', 'つなげる', '繋げる', 'つなぎ', '繋ぎ'], kw2: 'つなぎます',
  msg1: '⚠️閉じる前に、\nこれだけは読んでください。\n\n出雲で結ばれた縁は、\nまっすぐ届くとは限りません。\n\n届く手前で\n止まっていることがあるのです。\n\n止めているのが、\n家族のことなのか、\n仕事のことなのか。\n人によってまるで違います。\n\n下のボタンを押していただければ、\n視えたものを\nそのままお届けします。\n\n神様が発つ\n12月4日の夜を過ぎると、\n止まった縁は\nそのまま置いていかれます。\n\n下のボタンから、\nお待ちしています。',
  msg2: 'あなたの縁は、\nまだ切れていません。\n12月4日の夜までなら、\n間に合います。\n\n下のボタンを押すと、\n澪から最初のお伺いが\n届きます。\nいただいたお返事を、\n私が一人で読んで視ます。\n\n押さずに閉じると、\n縁を止めているものは\nそのまま残ります。\n\n届いた順にお返ししています。' },
  { key: '1127f', from: '2026-11-26', type: 'feed', kw: ['迎える', '迎え', 'むかえる', 'むかえ'], kw2: '迎えます',
  msg1: '⚠️閉じる前に、\nこれだけは読んでください。\n\n神在祭で結ばれた縁は、\nいま神様の手で\n運ばれている途中です。\n誰の手に渡るかは、\n11月29日が境目です。\n\nあなたへ向かっている縁が、\n家族のことなのか、\n仕事のことなのか。\n人によってまるで違います。\n\n下のボタンを押していただければ、\n視えたものを\nそのままお届けします。\n\n受け取り手のないまま\n29日を越えると、\n12月の縁は\n別の誰かの手に渡ります。\n\n下のボタンから、\nお待ちしています。',
  msg2: 'あなたへの縁は、まだ\n運ばれている途中です。\n11月29日までなら、\n間に合います。\n\n下のボタンを押すと、\n澪から最初のお伺いが\n届きます。\nいただいたお返事を、\n私が一人で読んで視ます。\n\n押さずに閉じると、\n迎えるはずだった縁が\n素通りしていきます。\n\n届いた順にお返ししています。' },
  { key: '1127r', from: '2026-11-26', type: 'reel', kw: ['約束', 'やくそく'], kw2: '約束します',
  msg1: '⚠️閉じる前に、\nこれだけは読んでください。\n\n出雲大社を発った神様は、\n帰る前に立ち寄った神社で\n「また来年会おう」と\n約束を交わします。\n\nその約束に、\nあなたの縁が入っているか。\n家族のことなのか、\n仕事のことなのか。\n人によってまるで違います。\n\n下のボタンを押していただければ、\n視えたものを\nそのままお届けします。\n\n12月4日の夜を過ぎると、\n来年の縁の約束は\n閉じてしまいます。\n\n下のボタンから、\nお待ちしています。',
  msg2: 'あなたの縁は、まだ\n約束に間に合います。\n12月4日の夜までなら、\n入れられます。\n\n下のボタンを押すと、\n澪から最初のお伺いが\n届きます。\nいただいたお返事を、\n私が一人で読んで視ます。\n\n押さずに閉じると、\n来年もそばにいるはずの人が\n離れていってしまいます。\n\n届いた順にお返ししています。' },
];

function today(){ return new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10); }   // 日本の日付
var Q = new URLSearchParams(location.search);
var TEST = Q.get('auto') || Q.get('p');
var live = POSTS.filter(function(x){ return x.from <= today(); }).sort(function(a,b){ return a.from < b.from ? -1 : 1; });   // 古い→新しい（同じ言葉は新しい投稿に当てる）
if (!live.length) live = POSTS.slice();
var FALLBACK = POSTS[0];   // 合わない言葉は「知る」の文（11/25〜・前は最新のフィード＝まだ出していない投稿に当たった）
function norm(t){ return t.replace(/[\s　「」『』。、！!？?・]/g, ''); }
function pick(t){
  var n = norm(t);
  for (var i = live.length - 1; i >= 0; i--) {
    for (var j = 0; j < live[i].kw.length; j++) { var k = norm(live[i].kw[j]); if (n.indexOf(k) >= 0 || (n.length >= 2 && k.indexOf(n) === 0)) return live[i]; }
  }
  return null;
}

var VID = (function(){ try { var v = localStorage.getItem('vid'); if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('vid', v); } return v; } catch (e) { return 'x' + Math.random().toString(36).slice(2); } })();
function log(ev, k){
  if (TEST) return;
  var body = JSON.stringify({ ev: ev, k: k || '', v: VID });
  // GitHub Pages の写し（mio-izumo.github.io）から開かれても、記録は Cloudflare（mio-izumo.pages.dev）へ送る。text/plain は別のドメインへもそのまま届く
  var URL_LOG = location.hostname === 'mio-izumo-axf.pages.dev' ? '/log' : 'https://mio-izumo-axf.pages.dev/log'; // 11/26 会社のCloudflareへ移った
  try { if (navigator.sendBeacon && navigator.sendBeacon(URL_LOG, new Blob([body], {type: 'text/plain'}))) return; } catch (e) {}
  try { fetch(URL_LOG, { method: 'POST', body: body, mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, keepalive: true }); } catch (e) {}
}

var chat = document.getElementById('chat');
var reply = document.getElementById('reply');
var input = document.getElementById('msg');
var nt = document.getElementById('notice'); if (nt) nt.remove();
input.placeholder = '投稿の言葉を入力';
document.getElementById('hint').textContent = '';

function add(node, who){
  var row = document.createElement('div');
  row.className = 'row ' + who;
  if (who === 'mio') { var av = document.createElement('img'); av.className = 'av'; av.src = 'img/icon.jpg'; av.alt = ''; row.appendChild(av); }
  row.appendChild(node);
  chat.appendChild(row);
  requestAnimationFrame(function(){ row.classList.add('show'); });
  // 長い文は頭から読めるように、届いた吹き出しの頭を見出しのすぐ下に合わせる（最初の案内は動かさない）
  if (chat.children.length > 1) setTimeout(function(){
    var y = row.getBoundingClientRect().top + window.scrollY - 76;
    if (y > window.scrollY) window.scrollTo({top: y, behavior: 'smooth'});
  }, 50);
  return row;
}
function bubble(text){ var b = document.createElement('div'); b.className = 'bubble'; b.textContent = text; return b; }
function typing(ms, then){
  var d = document.createElement('div'); d.className = 'bubble dots'; d.innerHTML = '<i></i><i></i><i></i>';
  var row = add(d, 'mio');
  setTimeout(function(){ row.remove(); then(); }, ms);
}

log('open');
typing(900, function(){
  add(bubble(GREET), 'mio');
  setTimeout(function(){ reply.classList.add('show'); }, 600);
});

// 自動返信と同じ流れ：投稿の言葉を送る → 1通目（その投稿の・2つ目の言葉を頼む）→ 2つ目の言葉を送る → 2通目 → LINEのボタン
// 合わない言葉でも止めない（1回目は FALLBACK、2回目は何でも通す）
var step = 1, P = null;
function showReply(hint){ input.value = ''; input.placeholder = hint ? '「' + hint + '」と入力' : '投稿の言葉を入力';
  document.getElementById('hint').textContent = '';
  reply.classList.remove('gone'); setTimeout(function(){ reply.classList.add('show'); }, 600); }
function panel(){
  var p = document.createElement('div'); p.className = 'panel';
  p.innerHTML = '<img alt=""><div class="t"></div><div class="s"></div><a></a>';
  p.querySelector('img').src = PANEL.img;
  p.querySelector('.t').textContent = PANEL.title; p.querySelector('.s').textContent = PANEL.sub || '';
  var a = p.querySelector('a'); a.href = PANEL.url; a.textContent = PANEL.button;
  a.addEventListener('click', function(){ log('line', P.key); });
  add(p, 'mio');
}
document.getElementById('form').addEventListener('submit', function(e){
  e.preventDefault();
  var t = input.value.trim();
  if (!t) { reply.classList.add('shake'); setTimeout(function(){ reply.classList.remove('shake'); }, 400); input.focus(); return; }
  input.blur();
  reply.classList.remove('show'); reply.classList.add('gone');
  add(bubble(t), 'me');
  if (step === 1) {
    var hit = pick(t); P = hit || FALLBACK; step = 2;
    log('send', hit ? P.key : 'other');
    // 11/28〜 本人「リンクを踏むので労力がいる。そこから2つ目を送らせるのはしんどい」→ 1通目のすぐ下にLINEのボタン（2つ目の言葉は頼まない）
    typing(1400, function(){ add(bubble(P.msg1), 'mio'); log('reply', P.key); typing(900, panel); });
  } else {
    step = 3;
    log('reply', P.key);
    typing(1400, function(){ add(bubble(P.msg2), 'mio'); typing(900, panel); });
  }
});
// 見た目の確かめ用：?auto=<1回目の言葉> で2回とも自動で送る（数えない）
if (Q.get('auto')) {
  var w1 = Q.get('auto') === '1' ? '結ぶ' : Q.get('auto');
  setTimeout(function(){ input.value = w1; document.getElementById('form').requestSubmit(); }, 2000);
}
</script>
</body>
</html>
